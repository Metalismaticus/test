<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Duskguard</title><link rel="icon" type="image/png" href="assets/art/v6/game/icon-64.png"><link rel="apple-touch-icon" href="assets/art/v6/game/icon-192.png">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17131b;color:#d9bd9e;font-family:Georgia,serif}#bastion{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;background:#17131b}h1{letter-spacing:.12em;font-size:clamp(22px,4vw,42px)}p{color:#ab8391}</style>
<script>
// Browsers start audio suspended until the player clicks, taps or presses a key, and the game
// opens its audio output while loading. Keep every AudioContext the game creates and resume
// them on the first (and any later) gesture, so music and sounds start with the first click.
(function () {
  var Original = window.AudioContext || window.webkitAudioContext;
  if (!Original) return;
  var contexts = (window.__audioContexts = []);
  function Tracked(options) {
    var context = options === undefined ? new Original() : new Original(options);
    contexts.push(context);
    return context;
  }
  Tracked.prototype = Original.prototype;
  window.AudioContext = Tracked;
  window.webkitAudioContext = Tracked;
  function resume() {
    contexts.forEach(function (c) { if (c.state !== 'running') c.resume(); });
  }
  ['pointerdown', 'mousedown', 'touchstart', 'touchend', 'keydown'].forEach(function (e) {
    document.addEventListener(e, resume, { capture: true });
  });
})();
</script></head>
<body><canvas id="bastion" tabindex="0" aria-label="Duskguard"></canvas><div id="loading"><h1>DUSKGUARD</h1><p id="message">Разжигаем последний огонь…</p></div>
<script type="module">import init from './last_bastion.js';try{await init();document.querySelector('#message').textContent='Загружаем крепость…';document.querySelector('canvas').focus();}catch(e){document.querySelector('#message').textContent='Не удалось запустить игру. Нужен браузер с WebGL2. '+e.message;console.error(e);}</script></body></html>
